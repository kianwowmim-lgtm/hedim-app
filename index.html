:root{--em:#12a36f;--em2:#0d8a5d;--dg:#0b3d2e;--ink:#111714;--bg:#f2f5f3;--card:#ffffff;--mut:#66756e;--line:#e2eae5;--red:#d03b3b;--hero:#0b3d2e}
:root[data-theme="dark"]{--em:#2fcf8e;--em2:#1fb57a;--dg:#0c2a20;--ink:#eef5f1;--bg:#080a09;--card:#121815;--mut:#8fa097;--line:#1f2a25;--red:#ff6b6b;--hero:#0c2a20}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--em:#2fcf8e;--em2:#1fb57a;--dg:#0c2a20;--ink:#eef5f1;--bg:#080a09;--card:#121815;--mut:#8fa097;--line:#1f2a25;--red:#ff6b6b;--hero:#0c2a20}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.8}
header{background:var(--hero);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;max-width:980px;margin:0 auto}
.brand{font-weight:800;font-size:18px;font-family:'IRAN Kharazmi',Vazirmatn,Tahoma,sans-serif}
.mon{display:flex;align-items:center;gap:6px}
.mon button{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:10px;width:34px;height:34px;cursor:pointer;font-size:18px}
.mon span{min-width:110px;text-align:center;font-weight:600;font-family:'IRAN Kharazmi',Vazirmatn,Tahoma,sans-serif}
.theme{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:5px 10px;cursor:pointer;font:inherit;font-size:12px}
.hero{max-width:980px;margin:14px auto 0}
.hero small{opacity:.75;font-size:13px}
.hero b{display:block;font-size:30px;font-weight:800;margin-top:2px;font-family:'IRAN Kharazmi',Vazirmatn,Tahoma,sans-serif}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 12px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{flex:1 0 auto;border:0;background:transparent;color:var(--mut);padding:14px 12px 12px;font:inherit;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;font-family:'IRAN Kharazmi',Vazirmatn,Tahoma,sans-serif}
nav button[aria-selected="true"]{color:var(--em);border-bottom-color:var(--em);font-weight:600}
main{max-width:980px;margin:0 auto;padding:14px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.stat{font-size:12px;color:var(--mut)}
.stat b{display:block;font-size:17px;color:var(--ink);margin-top:2px;font-family:'IRAN Kharazmi',Vazirmatn,Tahoma,sans-serif}
.card b{font-family:'IRAN Kharazmi',Vazirmatn,Tahoma,sans-serif}
.muted{color:var(--mut);font-size:13px}
.inc{color:var(--em2)}.exp{color:var(--red)}
.sec{margin:18px 0 8px;font-weight:800;font-size:15px;font-family:'IRAN Kharazmi',Vazirmatn,Tahoma,sans-serif}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
label.f{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:4px}
input,select,button{font:inherit}
input,select{padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
.btn{background:var(--em);color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer}
:focus-visible{outline:3px solid var(--em);outline-offset:2px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
th{color:var(--mut);font-weight:600;font-size:12px}
.ico{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--bg);font-weight:800;color:var(--em2);margin-left:8px;vertical-align:middle;font-size:13px;font-family:'IRAN Kharazmi',Vazirmatn,Tahoma,sans-serif}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-size:12px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--em);border-radius:99px}
.bar i.warn{background:#e0a100}.bar i.over{background:var(--red)}
.chart{display:flex;gap:10px;align-items:flex-end;height:130px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--mut)}
.chart i{display:block;width:100%;background:var(--em);border-radius:8px 8px 0 0;min-height:3px;opacity:.85}
.chart div.cur i{opacity:1}
.chart div.cur span{color:var(--ink);font-weight:600}
textarea{width:100%;min-height:110px;font-size:12px;direction:ltr;text-align:left;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:monospace}
.toast{position:fixed;bottom:16px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;display:none;z-index:10}
.toast.on{display:block}
.dt{display:flex;gap:8px;flex-wrap:wrap}
.err{color:var(--red);font-size:13px;min-height:1.8em;margin:4px 0 0}
@media (max-width:600px){th,td{font-size:13px;padding:8px 3px}.mon span{min-width:90px}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.brand{animation:rise .6s both;position:relative;display:inline-block;height:1.9em;overflow:hidden;min-width:6em;vertical-align:middle}
.brand span{position:absolute;inset-inline-start:0;top:0;line-height:1.9em;white-space:nowrap;animation:slideA 6s ease-in-out infinite}
.brand .be{animation-name:slideB}
@keyframes slideA{0%,38%{transform:translateY(0);opacity:1}48%,88%{transform:translateY(-100%);opacity:0}98%,100%{transform:translateY(0);opacity:1}}
@keyframes slideB{0%,38%{transform:translateY(100%);opacity:0}48%,88%{transform:translateY(0);opacity:1}98%,100%{transform:translateY(100%);opacity:0}}
.hero small{animation:rise .6s .1s both}
.hero b{animation:rise .7s .2s both}
main>*{animation:rise .5s .15s both}
.bar i{transform-origin:right;animation:growX .9s .25s both}
.chart i{transform-origin:bottom;animation:growY .8s .25s both}
nav button{transition:color .25s,border-color .25s}
.card{transition:transform .2s}
.card:active{transform:scale(.99)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (prefers-reduced-motion:reduce){.brand .be{display:none}}
</style>
</head>
<body>
<!--
فونت: IRAN Kharazmi (ایران خوارزمی) — نرم‌افزار مالکیتی. طبق FontLicense.txt، کد لایسنس ۵ رقمی در این بخش درج شود:
LICENSE_CODE = "_____"
-->
<header>
  <div class="top">
    <div class="brand" title="هدیم / He'd'm"><span class="bf">هدیم</span><span class="be" aria-hidden="true">He'd'm</span></div>
    <div class="mon">
      <button data-act="prev" aria-label="ماه قبل">›</button>
      <span id="mlabel"></span>
      <button data-act="next" aria-label="ماه بعد">‹</button>
    </div>
    <button class="theme" data-act="theme">روشن / تاریک</button>
  </div>
  <div class="hero top" style="display:block">
    <small>موجودی کل حساب‌ها</small>
    <b id="hbal"></b>
    <small id="hnet"></small>
  </div>
</header>
<nav role="tablist" id="tabs">
  <button role="tab" data-act="tab" data-v="dash" aria-selected="true">خانه</button>
  <button role="tab" data-act="tab" data-v="tx" aria-selected="false">تراکنش‌ها</button>
  <button role="tab" data-act="tab" data-v="bud" aria-selected="false">بودجه</button>
  <button role="tab" data-act="tab" data-v="goal" aria-selected="false">اهداف</button>
  <button role="tab" data-act="tab" data-v="rep" aria-selected="false">گزارش</button>
</nav>
<main id="v"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const CATS=['خوراک','حمل‌ونقل','مسکن','قبوض','سلامت','آموزش','تفریح','حقوق','سایر'];
const JM=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const KEY='hedim-v2';
let S={tx:[],budgets:{},goals:[]}, view='dash', jy, jm, storageOK=true;

const $=s=>document.querySelector(s);
const p2=n=>String(n).padStart(2,'0');
const digitsFa=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const toEn=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const fa=n=>digitsFa(String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'٬'))+' تومان';
const num=v=>{const n=Math.round(Number(toEn(v).replace(/[,٬\s]/g,'')));return Number.isFinite(n)?n:NaN};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- تقویم شمسی ---------- */
function gToJ(gy,gm,gd){
  const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];
  const y=gy-1600;
  const gy2=gm>2?y+1:y;
  let days=365*y+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+gdm[gm-1];
  let jyr=979+33*Math.floor(days/12053);days%=12053;
  jyr+=4*Math.floor(days/1461);days%=1461;
  if(days>365){jyr+=Math.floor((days-1)/365);days=(days-1)%365}
  const jmo=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30);
  const jd=1+(days<186?days%31:(days-186)%30);
  return[jyr,jmo,jd];
}
function jToG(jy2,jm2,jd2){
  const jr=jy2-979;
  let days=365*jr+Math.floor(jr/33)*8+Math.floor((jr%33+3)/4)+78+jd2+(jm2<7?(jm2-1)*31:(jm2-7)*30+186);
  let gy=1600+400*Math.floor(days/146097);days%=146097;
  if(days>36524){gy+=100*Math.floor(--days/36524);days%=36524;if(days>=365)days++}
  gy+=4*Math.floor(days/1461);days%=1461;
  if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}
  let gd=days+1;
  const leap=(gy%4===0&&gy%100!==0)||gy%400===0;
  const ml=[31,leap?29:28,31,30,31,30,31,31,30,31,30,31];
  let gm=0;while(gd>ml[gm]){gd-=ml[gm];gm++}
  return[gy,gm+1,gd];
}
const jOf=iso=>{const[y,m,d]=iso.split('-').map(Number);return gToJ(y,m,d)};
const jkey=iso=>{const j=jOf(iso);return j[0]+'-'+j[1]};
const fmtJ=iso=>{const j=jOf(iso);return digitsFa(j[0]+'/'+p2(j[1])+'/'+p2(j[2]))};
function todayISO(){const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function todayJStr(){return fmtJ(todayISO())}
function parseJ(s){
  const m=toEn(s).trim().match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if(!m)return null;
  const a=+m[1],b=+m[2],c=+m[3];
  if(b<1||b>12||c<1||c>31)return null;
  const g=jToG(a,b,c);
  const back=gToJ(g[0],g[1],g[2]);
  if(back[0]!==a||back[1]!==b||back[2]!==c)return null;
  return g[0]+'-'+p2(g[1])+'-'+p2(g[2]);
}
function mon(y,m,k){const t=y*12+m-1+k;return[Math.floor(t/12),t%12+1]}
function sums(y,m){
  const key=y+'-'+m;let i=0,e=0;
  S.tx.forEach(t=>{if(jkey(t.date)!==key)return;if(t.type==='in')i+=t.amt;else e+=t.amt});
  return{i,e};
}


/* ---------- انتخاب تاریخ شمسی (سال، ماه، روز) ---------- */
function jMonthLen(y,m){for(let d=31;d>=29;d--){const g=jToG(y,m,d);const b=gToJ(g[0],g[1],g[2]);if(b[0]===y&&b[1]===m&&b[2]===d)return d}return 29}
function dayOpts(y,m,sel){const n=jMonthLen(y,m);let o='';for(let d=1;d<=n;d++)o+=`<option value="${d}"${d===Math.min(sel||1,n)?' selected':''}>${digitsFa(d)}</option>`;return o}
function dateSel(p,iso){
  const j=jOf(iso);
  let ys='';for(let y=j[0]-3;y<=j[0]+2;y++)ys+=`<option value="${y}"${y===j[0]?' selected':''}>${digitsFa(y)}</option>`;
  const ms=JM.map((n,i)=>`<option value="${i+1}"${i+1===j[1]?' selected':''}>${n}</option>`).join('');
  return `<div class="dt"><label class="f">سال<select id="${p}-y">${ys}</select></label><label class="f">ماه<select id="${p}-m">${ms}</select></label><label class="f">روز<select id="${p}-d">${dayOpts(j[0],j[1],j[2])}</select></label></div>`;
}
function readDate(p){const y=+$('#'+p+'-y').value,m=+$('#'+p+'-m').value,d=+$('#'+p+'-d').value;if(!(y&&m&&d))return null;const g=jToG(y,m,d);return g[0]+'-'+p2(g[1])+'-'+p2(g[2])}

/* ---------- ذخیره‌سازی ---------- */
function load(){
  try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
  if(!S||!Array.isArray(S.tx))S={tx:[],budgets:{},goals:[]};
  S.budgets=S.budgets||{};S.goals=S.goals||[];
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));return true}
  catch(e){storageOK=false;return false}
}
function commit(msg){
  const ok=save();
  render();
  if(!ok)flash('ذخیره مرورگر در دسترس نیست؛ داده‌ها فقط تا بستن صفحه می‌مانند');
  else if(msg)flash(msg);
}
function flash(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(flash.h);flash.h=setTimeout(()=>t.classList.remove('on'),2200)}
function setErr(id,msg){const el=$(id);if(el)el.textContent=msg}

/* دکمه‌های حساس: بار اول تأیید می‌خواهند، بار دوم انجام می‌شود */
function armed(el,fn){
  if(el.dataset.armed){clearTimeout(el._t);delete el.dataset.armed;el.textContent=el._old;fn();return}
  el.dataset.armed='1';el._old=el.textContent;el.textContent='مطمئنی؟';
  el._t=setTimeout(()=>{delete el.dataset.armed;el.textContent=el._old},3000);
}

/* ---------- نما ---------- */
const VIEWS={dash:()=>dash(),tx:()=>txView(),bud:()=>budView(),goal:()=>goalView(),rep:()=>repView()};
function render(){
  $('#mlabel').textContent=JM[jm-1]+' '+digitsFa(jy);
  const all=S.tx.reduce((a,t)=>a+(t.type==='in'?t.amt:-t.amt),0);
  const {i,e}=sums(jy,jm);
  $('#hbal').textContent=fa(all);
  $('#hnet').textContent='سود یا زیان '+JM[jm-1]+': '+(i-e>=0?'+':'−')+fa(Math.abs(i-e));
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===view));
  VIEWS[view]();
}

function listTable(arr){
  return `<div style="overflow-x:auto"><table>${arr.map(t=>`<tr><td><span class="ico">${t.type==='in'?'+':'−'}</span></td><td>${esc(t.desc||t.cat)}<div class="muted">${esc(t.cat)} · ${esc(t.acc)} · ${fmtJ(t.date)}</div></td><td class="${t.type==='in'?'inc':'exp'}" style="white-space:nowrap">${t.type==='in'?'+':'−'}${fa(t.amt)}</td><td><button class="ghost" data-act="del-tx" data-id="${t.id}" aria-label="حذف">✕</button></td></tr>`).join('')}</table></div>`;
}

function dash(){
  const {i,e}=sums(jy,jm),p=sums(...mon(jy,jm,-1));
  const delta=p.e?Math.round((e-p.e)/p.e*100):null;
  const months=[];for(let k=5;k>=0;k--)months.push(mon(jy,jm,-k));
  const vals=months.map(([y,m])=>sums(y,m).e);
  const max=Math.max(1,...vals);
  const bars=months.map(([y,m],idx)=>`<div class="${idx===5?'cur':''}"><i style="height:${Math.round(vals[idx]/max*100)}%"></i><span>${JM[m-1].slice(0,4)}</span></div>`).join('');
  const recent=S.tx.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
  $('#v').innerHTML=`
  <div class="grid">
    <div class="card stat">درآمد ماه<b class="inc">${fa(i)}</b></div>
    <div class="card stat">هزینه ماه<b class="exp">${fa(e)}</b>${delta===null?'':`<span class="muted">${delta>0?'+':''}${digitsFa(delta)}٪ نسبت به ماه قبل</span>`}</div>
    <div class="card stat">سود یا زیان ماه<b class="${i-e>=0?'inc':'exp'}">${fa(i-e)}</b></div>
  </div>
  <div class="sec">هزینه شش ماه اخیر</div>
  <div class="card"><div class="chart">${bars}</div></div>
  <div class="sec">آخرین تراکنش‌ها</div>
  <div class="card">${recent.length?listTable(recent):'<p class="muted">هنوز تراکنشی ثبت نشده است. از تب «تراکنش‌ها» شروع کنید.</p>'}</div>`;
}

function txView(){
  $('#v').innerHTML=`
  <div class="card">
    <div class="row">
      <label class="f">نوع<select id="tx-type"><option value="out">هزینه</option><option value="in">درآمد</option></select></label>
      <label class="f">مبلغ (تومان)<input id="tx-amt" inputmode="numeric"></label>
      ${dateSel('d',todayISO())}
      <label class="f">دسته<select id="tx-cat">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></label>
      <label class="f">حساب<input id="tx-acc" value="کیف پول" maxlength="40"></label>
      <label class="f">شرح<input id="tx-desc" maxlength="120"></label>
      <button class="btn" data-act="add-tx">ثبت تراکنش</button>
    </div>
    <p class="err" id="tx-err" role="alert"></p>
  </div>
  <div class="card">
    <div class="row" style="margin-bottom:8px">
      <input id="q" placeholder="جست‌وجو" style="flex:1">
      <select id="ft"><option value="">همه</option><option value="in">درآمد</option><option value="out">هزینه</option></select>
    </div>
    <div id="list"></div>
  </div>`;
  drawList();
}

function addTx(){
  const amt=num($('#tx-amt').value);
  if(!(amt>0)||amt>1e15){setErr('#tx-err','مبلغ معتبر وارد کنید؛ عددی بزرگ‌تر از صفر.');return}
  let iso=null;try{iso=readDate('d')}catch(e){iso=null}
  if(!iso){setErr('#tx-err','تاریخ معتبر انتخاب کنید.');return}
  S.tx.push({id:uid(),type:$('#tx-type').value==='in'?'in':'out',amt,date:iso,cat:$('#tx-cat').value,acc:($('#tx-acc').value.trim()||'کیف پول'),desc:$('#tx-desc').value.trim()});
  commit('تراکنش ثبت شد');
}

function drawList(){
  const q=toEn(($('#q')||{value:''}).value).trim().toLowerCase(),ft=($('#ft')||{value:''}).value;
  const arr=S.tx.filter(t=>(!ft||t.type===ft)&&(!q||(t.desc+' '+t.cat).toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date));
  const el=$('#list');
  if(el)el.innerHTML=arr.length?listTable(arr):'<p class="muted">موردی پیدا نشد.</p>';
}

function budView(){
  const key=jy+'-'+jm,spent={};
  S.tx.forEach(t=>{if(t.type==='out'&&jkey(t.date)===key)spent[t.cat]=(spent[t.cat]||0)+t.amt});
  $('#v').innerHTML=`<div class="sec">بودجه ${JM[jm-1]}</div><div class="grid">${CATS.map(c=>{
    const lim=S.budgets[c]||0,s=spent[c]||0,pct=lim?Math.min(100,s/lim*100):0;
    const cls=lim&&s>lim?'over':pct>=80?'warn':'';
    const info=lim?`خرج ${fa(s)} از ${fa(lim)}`:`خرج ${fa(s)}`;
    const left=lim?`<div class="muted">باقی‌مانده ${fa(Math.max(0,lim-s))}</div>`:'';
    return `<div class="card"><b>${esc(c)}</b><div class="muted">${info}</div>${left}<div class="bar"><i class="${cls}" style="width:${pct}%"></i></div>
    <div class="row" style="margin-top:10px"><input inputmode="numeric" placeholder="سقف ماهانه" value="${lim||''}" style="flex:1" aria-label="سقف بودجه ${esc(c)}" data-bud="${esc(c)}"></div></div>`}).join('')}</div>`;
}
function setBud(c,v){
  if(String(v).trim()===''){S.budgets[c]=0;commit('سقف بودجه حذف شد');return}
  const n=num(v);
  if(!(n>=0)){flash('عدد معتبر وارد کنید');budView();return}
  S.budgets[c]=n;commit('بودجه ذخیره شد');
}

function goalView(){
  $('#v').innerHTML=`
  <div class="card">
    <div class="row">
      <label class="f">نام هدف<input id="g-name" maxlength="60"></label>
      <label class="f">مبلغ هدف (تومان)<input id="g-target" inputmode="numeric"></label>
      <button class="btn" data-act="add-goal">افزودن هدف</button>
    </div>
    <p class="err" id="g-err" role="alert"></p>
  </div>
  <div class="grid">${S.goals.map(g=>{
    const p=g.target?Math.min(100,g.saved/g.target*100):0;
    return `<div class="card"><b>${esc(g.name)}</b><div class="muted">${fa(g.saved)} از ${fa(g.target)} · ${digitsFa(Math.round(p))}٪</div>
    <div class="bar"><i style="width:${p}%"></i></div>
    <div class="row" style="margin-top:10px"><input inputmode="numeric" placeholder="مبلغ واریز" id="c-${g.id}" style="flex:1"><button class="btn" data-act="contrib" data-id="${g.id}">واریز</button><button class="ghost" data-act="del-goal" data-id="${g.id}" aria-label="حذف هدف">✕</button></div></div>`
  }).join('')||'<p class="muted">هنوز هدفی ثبت نشده است.</p>'}</div>`;
}
function addGoal(){
  const name=$('#g-name').value.trim(),t=num($('#g-target').value);
  if(!name){setErr('#g-err','نام هدف را وارد کنید.');return}
  if(!(t>0)){setErr('#g-err','مبلغ هدف باید بزرگ‌تر از صفر باشد.');return}
  S.goals.push({id:uid(),name:name.slice(0,60),target:t,saved:0});
  commit('هدف افزوده شد');
}
function contrib(id){
  const g=S.goals.find(x=>x.id===id),inp=$('#c-'+id),v=num(inp?inp.value:'');
  if(!g)return;
  if(!(v>0)){flash('مبلغ واریز معتبر نیست');return}
  g.saved+=v;commit('واریز ثبت شد');
}

function repView(){
  const key=jy+'-'+jm,agg={in:{},out:{}};
  const rows=S.tx.filter(t=>jkey(t.date)===key);
  rows.forEach(t=>{agg[t.type][t.cat]=(agg[t.type][t.cat]||0)+t.amt});
  const {i,e}=sums(jy,jm);
  const tbl=o=>{const en=Object.entries(o).sort((a,b)=>b[1]-a[1]);return en.length?`<table>${en.map(([c,v])=>`<tr><td>${esc(c)}</td><td>${fa(v)}</td></tr>`).join('')}</table>`:'<p class="muted">داده‌ای برای این ماه نیست.</p>'};
  const csv='تاریخ,نوع,مبلغ (تومان),دسته,حساب,شرح\n'+rows.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[fmtJ(t.date),t.type==='in'?'درآمد':'هزینه',t.amt,t.cat,t.acc,t.desc].map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
  $('#v').innerHTML=`
  <div class="grid">
    <div class="card stat">درآمد<b class="inc">${fa(i)}</b></div>
    <div class="card stat">هزینه<b class="exp">${fa(e)}</b></div>
    <div class="card stat">خالص<b class="${i-e>=0?'inc':'exp'}">${fa(i-e)}</b></div>
  </div>
  <div class="sec">درآمد به تفکیک دسته</div><div class="card">${tbl(agg.in)}</div>
  <div class="sec">هزینه به تفکیک دسته</div><div class="card">${tbl(agg.out)}</div>
  <div class="sec">خروجی ${JM[jm-1]} (فایل جدولی)</div>
  <div class="card"><p class="muted">متن را انتخاب و کپی کنید.</p><textarea readonly>${esc(csv)}</textarea></div>
  <div class="sec">پشتیبان و بازیابی</div>
  <div class="card">
    <p class="muted">متن زیر کل داده‌های شماست. آن را کپی و ذخیره کنید. برای بازیابی، متن پشتیبان را داخل کادر بچسبانید.</p>
    <textarea id="bk">${esc(JSON.stringify(S,null,2))}</textarea>
    <p class="err" id="bk-err" role="alert"></p>
    <div class="row" style="margin-top:8px"><button class="btn" data-act="restore">بازیابی از پشتیبان</button><button class="ghost" data-act="sample">داده نمونه</button><button class="ghost" data-act="reset">حذف همه داده‌ها</button></div>
  </div>`;
}

function restore(){
  let d;
  try{d=JSON.parse($('#bk').value)}catch(e){setErr('#bk-err','متن پشتیبان معتبر نیست.');return}
  const ok=d&&Array.isArray(d.tx)&&Array.isArray(d.goals)&&d.budgets&&typeof d.budgets==='object'&&d.tx.every(t=>Number.isInteger(t.amt)&&t.amt>0&&['in','out'].includes(t.type)&&/^\d{4}-\d{2}-\d{2}$/.test(t.date));
  if(!ok){setErr('#bk-err','ساختار فایل پشتیبان درست نیست.');return}
  S={tx:d.tx,budgets:d.budgets,goals:d.goals};commit('بازیابی انجام شد');
}

function loadSample(){
  const add=(type,amt,day,cat,desc)=>{const iso=parseJ(`${jy}/${p2(jm)}/${p2(day)}`)||todayISO();S.tx.push({id:uid(),type,amt,date:iso,cat,acc:'کیف پول',desc})};
  add('in',25000000,1,'حقوق','حقوق ماهانه');
  add('out',4500000,3,'مسکن','اجاره');
  add('out',1200000,5,'قبوض','برق و گاز');
  add('out',2300000,8,'خوراک','خرید هفتگی');
  add('out',650000,12,'حمل‌ونقل','بنزین');
  S.budgets['خوراک']=3000000;S.budgets['مسکن']=5000000;
  S.goals.push({id:uid(),name:'سفر تابستانی',target:30000000,saved:6000000});
  commit('داده نمونه افزوده شد');
}

function toggleTheme(){
  const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const next=cur==='dark'?'light':'dark';
  document.documentElement.dataset.theme=next;
  try{localStorage.setItem('hedim-theme',next)}catch(e){}
}

/* ---------- رویدادها (تفویض یک‌جا؛ بدون فرم و بدون inline handler) ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(a==='tab'){view=el.dataset.v;render()}
  else if(a==='prev'){[jy,jm]=mon(jy,jm,-1);render()}
  else if(a==='next'){[jy,jm]=mon(jy,jm,1);render()}
  else if(a==='theme')toggleTheme();
  else if(a==='add-tx')addTx();
  else if(a==='del-tx')armed(el,()=>{S.tx=S.tx.filter(t=>t.id!==id);commit('تراکنش حذف شد')});
  else if(a==='add-goal')addGoal();
  else if(a==='contrib')contrib(id);
  else if(a==='del-goal')armed(el,()=>{S.goals=S.goals.filter(g=>g.id!==id);commit('هدف حذف شد')});
  else if(a==='restore')armed(el,restore);
  else if(a==='sample')loadSample();
  else if(a==='reset')armed(el,()=>{S={tx:[],budgets:{},goals:[]};commit('همه داده‌ها حذف شد')});
});
document.addEventListener('input',e=>{if(e.target.id==='q')drawList()});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='ft')drawList();
  else if(el.id==='d-y'||el.id==='d-m'){const dd=$('#d-d');if(dd)dd.innerHTML=dayOpts(+$('#d-y').value,+$('#d-m').value,+dd.value)}
  else if(el.dataset&&el.dataset.bud)setBud(el.dataset.bud,el.value);
});

function flushSave(){save()}
window.addEventListener('pagehide',flushSave);
window.addEventListener('beforeunload',flushSave);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushSave()});
load();
try{const t=localStorage.getItem('hedim-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
const now=jOf(todayISO());
jy=now[0];jm=now[1];
render();
</script>
<script>if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}</script>
</body>

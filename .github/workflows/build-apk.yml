name: Build Hedim APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create Capacitor project
        run: |
          mkdir -p app/www
          cp index.html manifest.json sw.js icon.svg app/www/
          cp "IRAN Kharazmi.woff" app/www/ || true
          cd app
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init Hedim com.hedim.app --web-dir www
          npx cap add android
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hedim-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
